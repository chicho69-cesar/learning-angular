<ng-container *ngIf="product">
  <h2>
    {{ product.title}}
  </h2>

  <p>
    $ {{ product.price }}
  </p>

  <img
    [ngSrc]="product.images[0]"
    [alt]="product.title"
    width="320"
    height="240"
    priority
  >
</ng-container>

<ng-container *ngIf="!product">
  <p>
    No hay producto
  </p>
</ng-container>
