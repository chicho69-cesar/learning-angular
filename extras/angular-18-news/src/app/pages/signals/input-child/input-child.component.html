<div class="container d-flex justify-content-center mt-5">
  <mat-card class="example-card">
    <mat-card-header>
      <mat-card-title>{{ name() }} {{ lastName() }}</mat-card-title>
      <mat-card-subtitle>Es un prestigioso programador de tan solo {{ age() }} años de edad</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ text() }}</p>
      <p>En 5 años tendrá {{ ageIn5Years() }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button [disabled]="unAvailable()">LIKE</button>
      <button mat-button [disabled]="unAvailable()">SHARE</button>
    </mat-card-actions>
  </mat-card>
</div>
