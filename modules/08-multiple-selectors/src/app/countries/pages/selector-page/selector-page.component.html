<h1 class="mt-3">Selectores anidados</h1>
<hr>

<form [formGroup]="form">
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Continente:</label>
      <select formControlName="region" class="form-control">
        <option value="">-- Seleccione Continente --</option>
        <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
      </select>
    </div>
  </div>

  <div class="row mb-3" *ngIf="countriesByRegion.length > 0">
    <div class="col">
      <label class="form-label">País:</label>
      <select formControlName="country" class="form-control">
        <option value="">-- Seleccione País --</option>
        <option *ngFor="let country of countriesByRegion" [value]="country.cca3">{{ country.name | titlecase }}</option>
      </select>
    </div>
  </div>

  <div class="row mb-3" *ngIf="borders.length > 0">
    <div class="col">
      <label class="form-label">Fronteras:</label>
      <select formControlName="border" class="form-control">
        <option value="">-- Seleccione Frontera --</option>
        <option *ngFor="let country of borders" [value]="country.cca3">{{ country.name | titlecase }}</option>
      </select>
    </div>
  </div>
</form>

<h3>Formulario</h3>

<code>
  {{ form.value | json }}
</code>

<p>
  Is valid: {{ form.valid }} <br>
  Is dirty: {{ form.dirty }} <br>
  Is touched: {{ form.touched }} <br>
  Is pristine: {{ form.pristine }} <br>
  Is pending: {{ form.pending }} <br>
  Is disabled: {{ form.disabled }} <br>
  Is enabled: {{ form.enabled }} <br>
</p>
