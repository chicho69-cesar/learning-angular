<h1>Counter: {{ counter() }}</h1>
<hr>
<h2>Square Counter {{ square() }}</h2>
<hr>

<button class="btn btn-primary" (click)="changeBy(+1)">
  +1
</button>

&nbsp;

<button class="btn btn-primary" (click)="changeBy(-1)">
  -1
</button>

&nbsp;

<button class="btn btn-primary" (click)="this.counter.set(0)">
  Reset
</button>
