<h2>Reactivos: <small>Dinámicos</small></h2>
<hr>

<form [formGroup]="myForm" (ngSubmit)="onSubmit()" autocomplete="off">
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Nombre</label>

    <div class="col-sm-9">
      <input
        type="text"
        class="form-control"
        formControlName="name"
        placeholder="Nombre de la persona"
      >

      <span *ngIf="isValidField('name')" class="form-text text-danger">
        {{ getFieldError('name') }}
      </span>
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Agregar</label>

    <div class="col-sm-9">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          [formControl]="newFavoriteGame"
          placeholder="Agregar favorito"
        >

        <button
          class="btn btn-outline-primary"
          type="button"
          (click)="onAddToFavorites()"
        >
          Agregar favorito
        </button>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Favoritos</label>

    <div class="col-sm-9" formArrayName="favoriteGames">
      <div class="mb-1" *ngFor="let favorite of favoriteGames.controls; let i = index">
        <div class="input-group">
          <input
            type="text"
            [formControlName]="i"
            class="form-control"
          >

          <button
            class="btn btn-outline-danger"
            type="button"
            (click)="onDeleteFavorite(i)"
          >
            Eliminar
          </button>
        </div>

        <span *ngIf="isValidFieldInArray(favoriteGames, i)" class="form-text text-danger">
          Este campo es obligatorio
        </span>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-12">
      <button
        type="submit"
        class="btn btn-primary float-end"
      >
        <!-- [disabled]="myForm.invalid" -->
        Guardar
      </button>
    </div>
  </div>
</form>

<span>Valid</span>
<pre>{{ myForm.valid | json }}</pre>
<br>

<span>Value</span>
<pre>{{ myForm.value | json }}</pre>
<br>

<span>Agregar juego</span>
<pre>{{ newFavoriteGame.valid | json }}</pre>
<pre>{{ newFavoriteGame.value | json }}</pre>
