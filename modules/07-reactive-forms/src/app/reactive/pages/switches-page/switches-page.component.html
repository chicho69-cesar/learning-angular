<h2>Reactivos: Switches</h2>
<hr>

<form [formGroup]="myForm" (ngSubmit)="onSave()" autocomplete="off">
  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Género</label>

    <div class="col-sm-9">
      <div class="form-check">
        <input
          type="radio"
          class="form-check-input"
          value="M"
          formControlName="gender"
          id="maleRadio"
        >

        <label class="form-check-label" for="maleRadio">
          Masculino
        </label>
      </div>

      <div class="form-check">
        <input
          type="radio"
          class="form-check-input"
          value="F"
          formControlName="gender"
          id="femaleRadio"
        >

        <label class="form-check-label" for="femaleRadio">
          Femenino
        </label>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Notificaciones</label>

    <div class="col-sm-9">
      <div class="form-check form-switch mt-2">
        <input
          type="checkbox"
          class="form-check-input"
          formControlName="wantNotifications"
          id="wantNotificationsSwitch"
        >

        <label class="form-check-label" for="wantNotificationsSwitch">
          Deseo recibir notificaciones
        </label>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <label class="col-sm-3 col-form-label">Términos y Condiciones</label>

    <div class="col-sm-9">
      <div class="form-check form-switch mt-2">
        <input
          type="checkbox"
          class="form-check-input"
          formControlName="termsAndConditions"
          id="termsAndConditionsSwitch"
        >

        <label class="form-check-label" for="termsAndConditionsSwitch">
          Deseo recibir notificaciones
        </label>
      </div>

      <span *ngIf="isValidField('termsAndConditions')" class="form-text text-danger">
        Debes aceptar los términos y condiciones
      </span>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <button
        class="btn btn-primary float-end"
        type="submit"
      >
        Guardar
      </button>
    </div>
  </div>
</form>

<h5>Valor del formulario</h5>
<pre>{{ myForm.value| json }}</pre>
<br>

<h5>Persona</h5>
<pre>{{ person | json }}</pre>
<br>

<h5>Valid</h5>
<pre>{{ myForm.valid | json }}</pre>
