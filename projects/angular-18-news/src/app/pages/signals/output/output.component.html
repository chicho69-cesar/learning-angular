<div class="container d-flex justify-content-center mt-5">
  <div>
    Presiona el botón para cambiar la visibilidad del badge

    <button mat-raised-button [matBadge]="badge()" [matBadgeHidden]="hidden" (click)="toggleBadgeVisibility()">
      Esconder
    </button>
  </div>
</div>

<div class="container d-flex justify-content-center mt-5">
  <app-output-child (add)="handleAdd()" (delete)="handleDelete($event)" />
</div>
