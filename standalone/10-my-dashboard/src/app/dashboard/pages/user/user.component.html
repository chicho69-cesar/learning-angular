<app-title [title]="titleLabel()" />

@if (user()) {
  <section>
    <img [srcset]="user()!.avatar" [alt]="user()!.first_name" />

    <div>
      <h3>{{ user()?.first_name }} {{ user()?.last_name }}</h3>
      <p>{{ user()?.email }}</p>
    </div>
  </section>
} @else {
  <p i18n="User info loading label">Loading user info...</p>
}
