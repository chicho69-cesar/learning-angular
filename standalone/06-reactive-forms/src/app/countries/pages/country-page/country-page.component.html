<h1 class="mt-3">Selectores anidados</h1>
<hr />

<form [formGroup]="countryForm">
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Continente:</label>
      <select formControlName="region" class="form-control">
        <option value="">-- Seleccione Continente --</option>

        @for (region of regions(); track region) {
          <option [value]="region">
            {{ region }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">País:</label>
      <select formControlName="country" class="form-control">
        <option value="">-- Seleccione País --</option>

        @for (country of countriesByRegion(); track country) {
          <option [value]="country.cca3">
            {{ country.name.common }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Fronteras:</label>
      <select formControlName="border" class="form-control">
        <option value="">-- Seleccione Frontera --</option>

        @for (border of bordersByCountry(); track border) {
          <option [value]="border.cca3">
            {{ border.name.common }}
          </option>
        }
      </select>
    </div>
  </div>
</form>

<h3>Formularios:</h3>
<code>
  {{ countryForm.value | json }}
</code>

<p>Is form valid: {{ countryForm.valid }}</p>
<p>Value: {{ countryForm.value | json }}</p>
